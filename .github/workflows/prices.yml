name: Update prices

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      store:
        description: "Only this store (Walmart or Best Buy), empty for all"
        required: false
      debug:
        description: "Log why a product was not matched"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency: prices

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Fetch prices
        run: npm run update-prices
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ONLY_STORE: ${{ inputs.store }}
          DEBUG_PRICES: ${{ inputs.debug && '1' || '' }}

      - name: Check before saving
        run: |
          node -e "JSON.parse(require('fs').readFileSync('server/data/products.json','utf8'))"
          npm test
          npm run build

      - name: Save new prices
        run: |
          git config user.name "Jugnu"
          git config user.email "jugnush@users.noreply.github.com"
          git add server/data/products.json
          git diff --cached --quiet || (git commit -m "Update prices" && git push)

      - name: Open an issue if this run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Price update failed ($(date -u +%Y-%m-%d))" \
            --body "The scheduled price update failed. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
